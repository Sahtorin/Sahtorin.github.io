<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The DogDex - Sources</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .sources-headline {
            font-size: 2.2rem;
            font-weight: bold;
            text-align: center;
            margin: 15px 0;
        }
        .title-bowl-decor {
            width: 70px;
            height: auto;
            display: block;
            margin: 30px auto 15px auto;
        }
    </style>
</head>
<body>

<div id="header-placeholder"></div>

<script>
  fetch('header.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('header-placeholder').innerHTML = data;
    });
</script>

    <main class="container">
        <h1 class="sources-headline">Image and Information Sources
        <img src="Images/dog-food.png" alt="Dog Bowl Icon Decor" class="title-bowl-decor">
        <span class="sources-headline">Image and Information Sources</span>
        <img src="Images/dog-food.png" alt="Dog Bowl Icon Decor">
        </h1>
    </main>

    <footer class="main-footer">
        <div class="footer-column">
            <h4>The DogDex</h4>
            <p>Breed List | Accessibility | Sources | Contact</p>
        </div>
    </footer>

</body>
</html>
