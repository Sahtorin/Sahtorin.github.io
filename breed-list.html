<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The DogDex - Breed List</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .list-workspace {
            max-width: 1000px;
            margin: 30px auto;
            text-align: center;
        }
        .heading-bone-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            border: 2px dashed #333;
            padding: 12px 40px;
            background-color: #fff;
            font-size: 1.75rem;
            font-weight: bold;
            margin: 30px auto 40px auto;
            position: relative;
            left: 50%;
            transform: translateX(-50%);
        }
        .bone-decor {
            width: 30px;
            height: auto;
        }
        .index-card-frame {
            background-color: transparent;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 30px;
            min-height: 450px;
            text-align: left;
            margin-bottom: 40px;
        }
        .alphabetical-deck {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 5px;
        }
        .letter-node {
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            padding: 4px 8px;
            user-select: none;
        }
        .letter-node:hover {
            background-color: rgba(255,255,255,0.6);
            border-radius: 3px;
        }
        .letter-node.active-tier {
            background-color: #333;
            color: #fcdfa8;
            border-radius: 3px;
        }
        .breed-results-view {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            list-style: none;
        }
        .breed-result-card {
            background-color: #fff;
            border: 1px solid rgba(0,0,0,0.1);
            padding: 15px;
            border-radius: 4px;
            font-weight: bold;
        }
        .empty-view-notice {
            grid-column: 1 / -1;
            text-align: center;
            color: #666;
            font-style: italic;
            padding-top: 50px;
        }
    </style>
</head>
<body>

<div id="header-placeholder"></div>

<script>
  fetch('header.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('header-placeholder').innerHTML = data;
    });
</script>

    <main class="container">
        <div class="heading-bone-box">
            <img src="images/image_KtttQW.png" alt="Decorative Bone" class="bone-decor">
            <span>Breed List</span>
            <img src="images/image_KtttQW.png" alt="Decorative Bone" class="bone-decor">
        </div>

        <section class="index-card-frame">
            <div class="alphabetical-deck" id="alphabetical-deck">
                <span class="letter-node active-tier">A</span>
                <span class="letter-node">B</span><span class="letter-node">C</span>
                <span class="letter-node">D</span><span class="letter-node">E</span>
                <span class="letter-node">F</span><span class="letter-node">G</span>
                <span class="letter-node">H</span><span class="letter-node">I</span>
                <span class="letter-node">J</span><span class="letter-node">K</span>
                <span class="letter-node">L</span><span class="letter-node">M</span>
                <span class="letter-node">N</span><span class="letter-node">O</span>
                <span class="letter-node">P</span><span class="letter-node">Q</span>
                <span class="letter-node">R</span><span class="letter-node">S</span>
                <span class="letter-node">T</span><span class="letter-node">U</span>
                <span class="letter-node">V</span><span class="letter-node">W</span>
                <span class="letter-node">X</span><span class="letter-node">Y</span>
                <span class="letter-node">Z</span>
            </div>

            <h3 style="margin-bottom: 20px; color: #444;" id="current-letter-heading">Breeds starting with "A"</h3>
            <ul class="breed-results-view" id="breed-results-view">
            </ul>
        </section>
    </main>

    <footer class="main-footer">
        <div class="footer-column">
            <h4>The DogDex</h4>
            <p>Enjoy nicely summarized and easy to understand pages.</p>
        </div>
        <div class="footer-column">
            <h4>Links</h4>
            <p>Breed List | Accessibility | Sources | Contact</p>
        </div>
    </footer>

    <script>
        const catalogDataset = [
            "Affenpinscher", "Afghan Hound", "Airedale Terrier", "Akita", "Alaskan Malamute",
            "Beagle", "Bernese Mountain Dog", "Bichon Frise", "Bloodhound", "Border Collie", "Boxer",
            "Chihuahua", "Chow Chow", "Cocker Spaniel", "Collie", "Dachshund", "Dalmatian", "Doberman Pinscher",
            "English Bulldog", "French Bulldog", "German Shepherd", "Golden Retriever", "Great Dane",
            "Greyhound", "Havanese", "Irish Setter", "Jack Russell Terrier", "Labrador Retriever", "Maltese", 
            "Newfoundland", "Papillon", "Pomeranian", "Poodle", "Pug", "Rottweiler", "Saint Bernard", 
            "Samoyed", "Shih Tzu", "Siberian Husky", "Shiba Inu", "Vizsla", "Weimaraner", "Welsh Corgi", "Yorkshire Terrier"
        ];

        const deckNode = document.getElementById('alphabetical-deck');
        const viewNode = document.getElementById('breed-results-view');
        const headingText = document.getElementById('current-letter-heading');

        function evaluateQueryFilter(selectedChar) {
            headingText.textContent = `Breeds starting with "${selectedChar}"`;
            viewNode.innerHTML = '';
            
            const queryMatches = catalogDataset.filter(entry => 
                entry.toUpperCase().startsWith(selectedChar.toUpperCase())
            );

            if(queryMatches.length === 0) {
                const noticeItem = document.createElement('li');
                noticeItem.className = 'empty-view-notice';
                noticeItem.textContent = 'No breed profiles logged under this character block yet.';
                viewNode.appendChild(noticeItem);
                return;
            }

            queryMatches.forEach(matchedValue => {
                const nodeElement = document.createElement('li');
                nodeElement.className = 'breed-result-card';
                nodeElement.textContent = matchedValue;
                viewNode.appendChild(nodeElement);
            });
        }

        deckNode.addEventListener('click', (routingEvent) => {
            if(routingEvent.target.classList.contains('letter-node')) {
                const targetNodes = deckNode.querySelectorAll('.letter-node');
                targetNodes.forEach(elementNode => elementNode.classList.remove('active-tier'));
                
                routingEvent.target.classList.add('active-tier');
                evaluateQueryFilter(routingEvent.target.textContent.trim());
            }
        });

        evaluateQueryFilter('A');
    </script>
</body>
</html>
