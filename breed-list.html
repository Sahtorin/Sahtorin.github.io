<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The DogDex - Breed List</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .breed-container {
            max-width: 1000px;
            margin: 40px auto;
            text-align: center;
        }
        .breed-title-box {
            display: inline-block;
            border: 2px dashed #000;
            padding: 10px 30px;
            margin-bottom: 20px;
            background: #fff;
            font-size: 1.8rem;
            font-weight: bold;
        }
        .alphabet-box {
            background-color: #fff;
            border: 1px solid #333;
            border-radius: 8px;
            min-height: 400px;
            padding: 25px;
            text-align: left;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .letter-tabs {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #333;
            padding-bottom: 15px;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 25px;
        }
        .letter-tabs span {
            font-weight: bold;
            cursor: pointer;
            padding: 5px 10px;
            border: 1px solid transparent;
            user-select: none;
        }
        .letter-tabs span:hover {
            border: 1px solid #000;
            border-radius: 4px;
            background-color: #fcdfa8;
        }
        .letter-tabs span.active {
            background-color: #333;
            color: #fff;
            border-radius: 4px;
        }
        .results-heading {
            font-size: 1.4rem;
            margin-bottom: 15px;
            color: #444;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 5px;
        }
        .breed-results-list {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .breed-item {
            background: #fcdfa8;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: 500;
            border: 1px solid rgba(0,0,0,0.1);
        }
        .no-results {
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="logo"><a href="index.html">The DogDex</a></div>
        <nav>
            <ul>
                <li><a href="breed-list.html" style="text-decoration: underline;">Breed List</a></li>
                <li><a href="accessibility.html">Accessibility</a></li>
                <li><a href="sources.html">Sources</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="breed-container">
        <div class="breed-title-box">
             🦴 Breed List 🦴
        </div>
        
        <div class="alphabet-box">
            <!-- Navigation Tabs (A-Z) -->
            <div class="letter-tabs" id="tabs-container">
                <span class="active">A</span><span>B</span><span>C</span><span>D</span><span>E</span><span>F</span><span>G</span>
                <span>H</span><span>I</span><span>J</span><span>K</span><span>L</span><span>M</span><span>N</span>
                <span>O</span><span>P</span><span>Q</span><span>R</span><span>S</span><span>T</span><span>U</span>
                <span>V</span><span>W</span><span>X</span><span>Y</span><span>Z</span>
            </div>
            
            <!-- Dynamic Content Output Area -->
            <h3 class="results-heading" id="current-letter-heading">Breeds starting with "A"</h3>
            <ul class="breed-results-list" id="breed-display-list">
                <!-- JavaScript will populate items here -->
            </ul>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-column">
            <h4>The DogDex</h4>
            <p><a href="breed-list.html">Breed List</a> | <a href="accessibility.html">Accessibility</a> | <a href="sources.html">Sources</a> | <a href="contact.html">Contact</a></p>
        </div>
    </footer>

    <!-- INTERACTIVE FILTERING SCRIPT -->
    <script>
        // 1. Mock Database of dog breeds
        const dogBreeds = [
            "Affenpinscher", "Afghan Hound", "Airedale Terrier", "Akita", "Alaskan Malamute",
            "Beagle", "Bernese Mountain Dog", "Bichon Frise", "Bloodhound", "Border Collie", "Boxer",
            "Chihuahua", "Chow Chow", "Cocker Spaniel", "Collie",
            "Dachshund", "Dalmatian", "Doberman Pinscher",
            "English Bulldog", "French Bulldog",
            "German Shepherd", "Golden Retriever", "Great Dane",
            "Greyhound", "Havaneser", "Irish Setter", "Jack Russell Terrier",
            "Labrador Retriever", "Maltese", "Newfoundland", "Papillon",
            "Pomeranian", "Poodle", "Pug", "Rottweiler", "Saint Bernard", 
            "Samoyed", "Shih Tzu", "Siberian Husky", " Shiba Inu",
            "Vizsla", "Weimaraner", "Welsh Corgi", "Yorkshire Terrier"
        ];

        const tabsContainer = document.getElementById('tabs-container');
        const displayList = document.getElementById('breed-display-list');
        const headingText = document.getElementById('current-letter-heading');

        // 2. Function to filter and render items safely
        function displayLetterContent(letter) {
            // Update the display title
            headingText.textContent = `Breeds starting with "${letter}"`;
            
            // Clear current list content safely
            displayList.innerHTML = '';

            // Filter our array for breeds that match the clicked letter
            const filteredBreeds = dogBreeds.filter(breed => 
                breed.trim().toUpperCase().startsWith(letter)
            );

            // Display results or show a fallback empty notice
            if (filteredBreeds.length === 0) {
                const emptyNotice = document.createElement('li');
                emptyNotice.className = 'no-results';
                emptyNotice.textContent = 'No breeds found for this letter. Check back later!';
                displayList.appendChild(emptyNotice);
            } else {
                filteredBreeds.forEach(breed => {
                    const listItem = document.createElement('li');
                    listItem.className = 'breed-item';
                    listItem.textContent = breed;
                    displayList.appendChild(listItem);
                });
            }
        }

        // 3. Event Listener setup to handle tab clicks
        tabsContainer.addEventListener('click', (event) => {
            if (event.target.tagName === 'SPAN') {
                // Clear out prior selected active state highlights
                const allTabs = tabsContainer.querySelectorAll('span');
                allTabs.forEach(tab => tab.classList.remove('active'));

                // Target and highlight selected node
                event.target.classList.add('active');

                // Re-evaluate query list results frame
                const chosenLetter = event.target.textContent;
                displayLetterContent(chosenLetter);
            }
        });

        // Initialize display to show letter "A" entries by default on mount
        displayLetterContent('A');
    </script>
</body>
</html>
